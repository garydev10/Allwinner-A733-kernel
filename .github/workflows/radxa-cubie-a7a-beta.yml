name: Build & Release Radxa Cubie A7A Beta (Debian Trixie)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Debian release'
        required: true
        default: 'trixie'
        type: choice
        options:
          - trixie
          - bookworm
      flavour:
        description: 'Flavour / Edition'
        required: true
        default: 'minimal'
        type: choice
        options:
          - minimal
          - desktop-xfce
          - server
      tag_name:
        description: 'Custom release tag'
        required: false
        default: 'radxa-cubie-a7a-beta-v1.0.1'
      publish_release:
        description: 'Publish or update GitHub release'
        required: true
        default: true
        type: boolean
  push:
    paths:
      - '.github/workflows/radxa-cubie-a7a-beta.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Radxa Cubie A7A Beta Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bison flex bc libssl-dev libncurses-dev libelf-dev \
            debootstrap qemu-user-static binfmt-support u-boot-tools rsync cpio \
            kmod parted dosfstools fdisk xz-utils curl wget zstd pigz python3 \
            device-tree-compiler dialog lzop libyaml-dev pkg-config

      - name: Clone build harness and Wi-Fi drivers
        run: |
          git clone --depth 1 https://github.com/orangepi-xunlong/orangepi-build.git orangepi-build
          git clone --depth 1 https://github.com/shenmintao/aic8800d80.git aic8800d80

      - name: Apply A733 patches and configuration
        run: |
          git -C orangepi-build apply ../patch/orangepi-build.patch

          mkdir -p orangepi-build/external/patch/kernel/sun60iw2-next
          cp patch/0001-allwinner-a733-orangepi-4-pro-6.18-mainline.patch orangepi-build/external/patch/kernel/sun60iw2-next/
          cp patch/0300-packaging-armbian-builddeb.patch orangepi-build/external/patch/kernel/sun60iw2-next/

          mkdir -p orangepi-build/external/config/kernel
          cp config/orangepi_4pro_defconfig orangepi-build/external/config/kernel/linux-sun60iw2-next-a733.config

          mkdir -p orangepi-build/external/packages/bsp/common
          cp -rv overlay/* orangepi-build/external/packages/bsp/common/

      - name: Build Base Image via harness
        run: |
          RELEASE="${{ github.event.inputs.release || 'trixie' }}"
          FLAVOUR="${{ github.event.inputs.flavour || 'minimal' }}"

          BUILD_MINIMAL="no"
          BUILD_DESKTOP="no"
          DESKTOP_ENV_ARGS=""

          case "$FLAVOUR" in
            minimal)
              BUILD_MINIMAL="yes"
              BUILD_DESKTOP="no"
              ;;
            server)
              BUILD_MINIMAL="no"
              BUILD_DESKTOP="no"
              ;;
            desktop-xfce)
              BUILD_MINIMAL="no"
              BUILD_DESKTOP="yes"
              DESKTOP_ENV_ARGS="DESKTOP_ENVIRONMENT=xfce DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED="
              ;;
          esac

          echo "=== Building Base Image: Release=$RELEASE, Flavour=$FLAVOUR ==="
          cd orangepi-build
          sudo ./build.sh \
            BOARD=orangepi4pro \
            BRANCH=next \
            BUILD_OPT=image \
            RELEASE=${RELEASE} \
            BUILD_MINIMAL=${BUILD_MINIMAL} \
            BUILD_DESKTOP=${BUILD_DESKTOP} \
            ${DESKTOP_ENV_ARGS}

      - name: Build AIC8800D80 (a69c:8d80) Wi-Fi Driver
        run: |
          echo "=== Building AIC8800D80 kernel modules for 6.18 ==="
          KHDR=$(find orangepi-build/kernel/ -name "linux-headers-6.18*" -type d 2>/dev/null | head -n 1)
          if [ -z "$KHDR" ]; then
            KHDR=$(find orangepi-build/kernel/ -maxdepth 1 -name "linux-6.18*" -type d 2>/dev/null | head -n 1)
          fi
          echo "Using kernel headers from: $KHDR"
          cd aic8800d80/drivers/aic8800
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KDIR="$GITHUB_WORKSPACE/$KHDR" modules

      - name: Transform Image for Radxa Cubie A7A (Beta)
        run: |
          echo "=== Transforming built image into Radxa Cubie A7A Beta ==="
          RAW_IMG=$(find orangepi-build/output/ -type f -name "*.img" | head -n 1)
          if [ -z "$RAW_IMG" ]; then
            echo "ERROR: Built raw .img not found!"
            find orangepi-build/output/ -ls || true
            exit 1
          fi

          RADXA_IMG_NAME="Radxa-Cubie-A7A_1.0.1-beta_${{ github.event.inputs.release || 'trixie' }}_${{ github.event.inputs.flavour || 'minimal' }}_linux6.18.img"
          RADXA_IMG="orangepi-build/output/${RADXA_IMG_NAME}"
          sudo mv -v "$RAW_IMG" "$RADXA_IMG"

          MNT="/mnt/radxa_loop"
          sudo mkdir -p "$MNT"
          OFFSET=$((65536 * 512))
          sudo mount -o loop,offset=$OFFSET "$RADXA_IMG" "$MNT"

          # 1. Install Cubie A7A DTB (with EEE fixes)
          mkdir -p /tmp/dtb_compile
          CUBIE_DTB=$(find orangepi-build/ -name "sun60i-a733-cubie-a7a.dtb" 2>/dev/null | head -n 1)
          if [ -z "$CUBIE_DTB" ] || [ ! -f "$CUBIE_DTB" ]; then
            echo "Compiling Cubie A7A DTB from kernel source tree..."
            KDIR=$(find orangepi-build/kernel/ -maxdepth 1 -name "linux-6.18*" -type d 2>/dev/null | head -n 1)
            if [ -n "$KDIR" ] && [ -d "$KDIR/scripts/dtc/include-prefixes" ]; then
              DTC_BIN="$KDIR/scripts/dtc/dtc"
              [ ! -x "$DTC_BIN" ] && DTC_BIN="dtc"
              gcc -E -nostdinc -I "$KDIR/scripts/dtc/include-prefixes" -undef -D__DTS__ -x assembler-with-cpp -o /tmp/dtb_compile/cubie.dts.pre dts/sun60i-a733-cubie-a7a.dts
              $DTC_BIN -o /tmp/dtb_compile/sun60i-a733-cubie-a7a.dtb -b 0 -i"$KDIR/arch/arm64/boot/dts/allwinner/" -i"$KDIR/scripts/dtc/include-prefixes" -Wno-unique_unit_address -Wno-unit_address_vs_reg -Wno-avoid_unnecessary_addr_size -Wno-alias_paths -Wno-graph_child_address -Wno-interrupt_map -Wno-simple_bus_reg /tmp/dtb_compile/cubie.dts.pre
              CUBIE_DTB="/tmp/dtb_compile/sun60i-a733-cubie-a7a.dtb"
            fi
          fi
          echo "Using Cubie A7A DTB from: $CUBIE_DTB"
          sudo cp -v "$CUBIE_DTB" "$MNT/boot/sun60i-a733-cubie-a7a.dtb"
          sudo cp -v "$CUBIE_DTB" "$MNT/boot/dtb/allwinner/sun60i-a733-cubie-a7a.dtb"
          sudo cp -v "$CUBIE_DTB" "$MNT/boot/dtb/allwinner/sun60i-a733-orangepi-4-pro.dtb"
          find "$MNT/boot/dtb-"* -maxdepth 2 -name "allwinner" -exec sudo cp -v "$CUBIE_DTB" {}/sun60i-a733-cubie-a7a.dtb \; 2>/dev/null || true
          find "$MNT/boot/dtb-"* -maxdepth 2 -name "allwinner" -exec sudo cp -v "$CUBIE_DTB" {}/sun60i-a733-orangepi-4-pro.dtb \; 2>/dev/null || true

          # 2. Install Radxa Splash Screens & Watermark
          if [ -d "splash" ]; then
            [ -f "splash/boot.bmp" ] && sudo cp -v splash/boot.bmp "$MNT/boot/boot.bmp"
            [ -f "splash/logo.bmp" ] && sudo cp -v splash/logo.bmp "$MNT/boot/logo.bmp"
            if [ -d "$MNT/usr/share/plymouth/themes/orangepi" ]; then
              [ -f "splash/watermark.png" ] && sudo cp -v splash/watermark.png "$MNT/usr/share/plymouth/themes/orangepi/watermark.png"
            fi
          fi

          # 3. Configure Bootloader Environment & Root Mount
          sudo tee "$MNT/boot/radxaEnv.txt" > /dev/null << 'ENV_EOF'
          verbosity=1
          bootlogo=false
          console=both
          overlay_prefix=sun60i-a733
          fdtfile=allwinner/sun60i-a733-cubie-a7a.dtb
          rootdev=/dev/mmcblk0p1
          rootfstype=ext4
          extraargs=cma=256M
          ENV_EOF
          sudo cp -v "$MNT/boot/radxaEnv.txt" "$MNT/boot/orangepiEnv.txt"
          sudo cp -v "$MNT/boot/radxaEnv.txt" "$MNT/boot/a733-allwinnerEnv.txt"

          # 4. Patch boot.cmd and recompile boot.scr
          sudo sed -i 's/if test -e ${devtype} ${devnum} ${prefix}orangepiEnv.txt; then/if test -e ${devtype} ${devnum} ${prefix}radxaEnv.txt; then\n\tload ${devtype} ${devnum} ${load_addr} ${prefix}radxaEnv.txt\n\tenv import -t ${load_addr} ${filesize}\nelif test -e ${devtype} ${devnum} ${prefix}orangepiEnv.txt; then/' "$MNT/boot/boot.cmd"
          sudo mkimage -C none -A arm -T script -d "$MNT/boot/boot.cmd" "$MNT/boot/boot.scr"

          # 5. Fix /etc/fstab (direct root device)
          sudo sed -i 's/^UUID=[^ ]*/\/dev\/mmcblk0p1/' "$MNT/etc/fstab"

          # 6. Hostname and Hosts
          echo "radxa-cubie-a7a" | sudo tee "$MNT/etc/hostname"
          sudo tee "$MNT/etc/hosts" > /dev/null << 'HOSTS_EOF'
          127.0.0.1   localhost
          127.0.1.1   radxa-cubie-a7a
          ::1         localhost radxa-cubie-a7a ip6-localhost ip6-loopback
          fe00::0     ip6-localnet
          ff00::0     ip6-mcastprefix
          ff02::1     ip6-allnodes
          ff02::2     ip6-allrouters
          HOSTS_EOF

          # 7. OS Branding
          sudo tee "$MNT/etc/os-release" > /dev/null << 'OS_EOF'
          PRETTY_NAME="Radxa OS 1.0 Beta (Trixie)"
          NAME="Debian GNU/Linux"
          VERSION_ID="13"
          VERSION="13 (trixie) Beta"
          VERSION_CODENAME=trixie
          ID=debian
          HOME_URL="https://radxa.com"
          SUPPORT_URL="https://forum.radxa.com"
          BUG_REPORT_URL="https://github.com/radxa"
          OS_EOF
          echo "Radxa Cubie A7A Beta (Debian Trixie) \l\n" | sudo tee "$MNT/etc/issue"
          echo "Radxa Cubie A7A Beta (Debian Trixie)" | sudo tee "$MNT/etc/issue.net"

          # 8. Create Radxa User and remove orangepi user
          PASS_HASH=$(openssl passwd -6 -salt radxa123 radxa)
          sudo sed -i '/orangepi/ s/$/,radxa/' "$MNT/etc/group"
          echo "radxa:x:1001:" | sudo tee -a "$MNT/etc/group"
          echo "radxa:x:1001:1001:Radxa User,,,:/home/radxa:/bin/bash" | sudo tee -a "$MNT/etc/passwd"
          echo "radxa:${PASS_HASH}:19800:0:99999:7:::" | sudo tee -a "$MNT/etc/shadow"
          if [ -d "$MNT/home/orangepi" ]; then
            sudo cp -a "$MNT/home/orangepi/." "$MNT/home/radxa/"
            sudo rm -rf "$MNT/home/orangepi"
          else
            sudo mkdir -p "$MNT/home/radxa"
          fi
          sudo chown -R 1001:1001 "$MNT/home/radxa"
          echo "radxa ALL=(ALL) NOPASSWD: ALL" | sudo tee "$MNT/etc/sudoers.d/010_radxa-nopasswd"
          sudo sed -i '/^orangepi:/d' "$MNT/etc/passwd" "$MNT/etc/shadow" "$MNT/etc/group" 2>/dev/null || true

          # 9. Autologin setup for radxa
          if [ -d "$MNT/lib/systemd/system/getty@.service.d" ]; then
            sudo sed -i 's/autologin orangepi/autologin radxa/g' "$MNT/lib/systemd/system/getty@.service.d/"*.conf 2>/dev/null || true
          fi
          if [ -d "$MNT/lib/systemd/system/serial-getty@.service.d" ]; then
            sudo sed -i 's/autologin orangepi/autologin radxa/g' "$MNT/lib/systemd/system/serial-getty@.service.d/"*.conf 2>/dev/null || true
          fi
          if [ -f "$MNT/etc/lightdm/lightdm.conf.d/22-orangepi-autologin.conf" ]; then
            sudo sed -i 's/autologin-user=orangepi/autologin-user=radxa/' "$MNT/etc/lightdm/lightdm.conf.d/22-orangepi-autologin.conf"
          fi

          # 10. Rebrand Systemd Services (orangepi-* -> a733-allwinner-*)
          sudo rm -f "$MNT/etc/update-motd.d/41-orangepi-config" "$MNT/etc/orangepi.txt" 2>/dev/null || true
          if [ -d "$MNT/usr/lib/orangepi" ]; then
            sudo cp -r "$MNT/usr/lib/orangepi" "$MNT/usr/lib/a733-allwinner"
            (cd "$MNT/usr/lib/a733-allwinner" && for f in orangepi-*; do [ -e "$f" ] && sudo mv "$f" "$(echo "$f" | sed 's/orangepi-/a733-allwinner-/')"; done) || true
            sudo rm -rf "$MNT/usr/lib/orangepi"
          fi
          if [ -d "$MNT/etc/default" ]; then
            (cd "$MNT/etc/default" && for f in orangepi-*; do [ -e "$f" ] && sudo mv "$f" "$(echo "$f" | sed 's/orangepi-/a733-allwinner-/')"; done) || true
          fi
          (cd "$MNT/lib/systemd/system" && for s in orangepi-*.service orangepi-*.timer; do
            [ -f "$s" ] || continue
            news="$(echo "$s" | sed 's/orangepi-/a733-allwinner-/')"
            sudo mv "$s" "$news"
            sudo sed -i 's/\/usr\/lib\/orangepi\/orangepi-/\/usr\/lib\/a733-allwinner\/a733-allwinner-/g' "$news"
            sudo sed -i 's/orangepi-/a733-allwinner-/g' "$news"
            sudo sed -i 's/Orange Pi/Allwinner A733/g' "$news"
          done) || true
          for dir in "$MNT/etc/systemd/system/"*.wants; do
            [ -d "$dir" ] || continue
            for f in "$dir"/orangepi-*; do
              [ -e "$f" ] || continue
              newf="$(echo "$f" | sed 's/orangepi-/a733-allwinner-/')"
              target="$(readlink "$f" | sed 's/orangepi-/a733-allwinner-/')"
              sudo ln -sf "$target" "$newf"
              sudo rm -f "$f"
            done
          done

          # 11. Dynamic fstab service
          sudo tee "$MNT/usr/lib/a733-allwinner/a733-allwinner-update-fstab" > /dev/null << 'FSTAB_SH'
          #!/bin/bash
          set -e
          rootdev=$(findmnt -n -o SOURCE / 2>/dev/null || true)
          [ -z "$rootdev" ] && rootdev=$(mount | awk '$3 == "/" {print $1}' | head -n 1)
          if [ -n "$rootdev" ] && [ -b "$rootdev" ]; then
              partuuid=$(blkid -s PARTUUID -o value "$rootdev" 2>/dev/null || true)
              uuid=$(blkid -s UUID -o value "$rootdev" 2>/dev/null || true)
              if [ -n "$partuuid" ]; then target_root="PARTUUID=${partuuid}"
              elif [ -n "$uuid" ]; then target_root="UUID=${uuid}"
              else target_root="${rootdev}"; fi
              tmpfstab=$(mktemp)
              awk -v dev="$target_root" '$2 == "/" { print dev " / ext4 defaults,noatime,commit=600,errors=remount-ro 0 1"; next } { print }' /etc/fstab > "$tmpfstab"
              if [ -s "$tmpfstab" ]; then
                  mount -o remount,rw / 2>/dev/null || true
                  cp "$tmpfstab" /etc/fstab
                  chmod 644 /etc/fstab
              fi
              rm -f "$tmpfstab"
          fi
          exit 0
          FSTAB_SH
          sudo chmod +x "$MNT/usr/lib/a733-allwinner/a733-allwinner-update-fstab"
          sudo tee "$MNT/lib/systemd/system/a733-allwinner-update-fstab.service" > /dev/null << 'FSTAB_SRV'
          [Unit]
          Description=Update Root Filesystem Entry in /etc/fstab Dynamically
          DefaultDependencies=no
          After=systemd-remount-fs.service
          Before=local-fs.target
          ConditionPathExists=/usr/lib/a733-allwinner/a733-allwinner-update-fstab

          [Service]
          Type=oneshot
          ExecStartPre=/bin/mount -o remount,rw /
          ExecStart=/usr/lib/a733-allwinner/a733-allwinner-update-fstab
          RemainAfterExit=yes

          [Install]
          WantedBy=local-fs.target
          FSTAB_SRV
          sudo ln -sf /lib/systemd/system/a733-allwinner-update-fstab.service "$MNT/etc/systemd/system/local-fs.target.wants/a733-allwinner-update-fstab.service"

          # 12. Install AIC8800D80 Wi-Fi Driver & Firmware
          sudo mkdir -p "$MNT/lib/modules/"*"/kernel/drivers/net/wireless/aic8800/"
          sudo cp -v aic8800d80/drivers/aic8800/aic_load_fw/aic_load_fw.ko "$MNT/lib/modules/"*"/kernel/drivers/net/wireless/aic8800/"
          sudo cp -v aic8800d80/drivers/aic8800/aic8800_fdrv/aic8800_fdrv.ko "$MNT/lib/modules/"*"/kernel/drivers/net/wireless/aic8800/"
          sudo cp -v aic8800d80/drivers/aic8800/aic_zlp_quirk/aic_zlp_quirk.ko "$MNT/lib/modules/"*"/kernel/drivers/net/wireless/aic8800/"
          sudo mkdir -p "$MNT/lib/firmware/aic8800/"
          sudo cp -r aic8800d80/fw/* "$MNT/lib/firmware/"
          sudo cp -r aic8800d80/fw/* "$MNT/lib/firmware/aic8800/"
          sudo cp -v aic8800d80/aic.rules "$MNT/etc/udev/rules.d/99-aic.rules"
          sudo mkdir -p "$MNT/etc/usb_modeswitch.d/"
          sudo cp -v aic8800d80/usb_modeswitch/1111_1111 "$MNT/etc/usb_modeswitch.d/1111:1111"

          # 13. Install wpasupplicant, wireless-tools, and aic8800-start.sh
          sudo chroot "$MNT" /bin/bash -c "apt-get update && apt-get install -y --no-install-recommends wpasupplicant wireless-tools rfkill iw"
          sudo cp -v overlay/usr/local/bin/aic8800-start.sh "$MNT/usr/local/bin/aic8800-start.sh"
          sudo chmod +x "$MNT/usr/local/bin/aic8800-start.sh"

          # 14. Install PowerVR GPU Firmware & Disable fstrim on SD
          sudo mkdir -p "$MNT/lib/firmware/powervr/"
          [ -f overlay/lib/firmware/powervr/rogue_36.56.104.183_v1.fw ] && sudo cp -v overlay/lib/firmware/powervr/rogue_36.56.104.183_v1.fw "$MNT/lib/firmware/powervr/"
          sudo chroot "$MNT" systemctl disable fstrim.timer 2>/dev/null || sudo rm -f "$MNT/etc/systemd/system/timers.target.wants/fstrim.timer"

          # Run depmod
          KVER=$(basename $(ls -d "$MNT/lib/modules/"*))
          sudo chroot "$MNT" depmod -a "$KVER"

          sudo umount "$MNT"
          echo "[+] Image transformation complete: $RADXA_IMG"

      - name: Package artifacts
        run: |
          mkdir -p release_artifacts
          echo "Compressing Radxa Beta image with xz..."
          find orangepi-build/output/ -type f -name "Radxa-Cubie-A7A*beta*.img" | while read -r img; do
            base=$(basename "$img")
            xz -T0 -3 -c "$img" > "release_artifacts/${base}.xz"
            (cd release_artifacts && sha256sum "${base}.xz" > "${base}.xz.sha256")
          done
          ls -lh release_artifacts/

      - name: Create or update GitHub Release
        if: ${{ github.event.inputs.publish_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || 'radxa-cubie-a7a-beta-v1.0.1' }}
          name: Radxa Cubie A7A Beta 1.0.1 (Debian Trixie)
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            release_artifacts/*.xz
            release_artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
